<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="/images/logo.png" alt="Logo" height="30" class="me-2">
            Task Manager
      </a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3">Welcome, <span id="usernameDisplay"></span>!</span>
        <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-12">
        <div class="card shadow mb-4">
          <div class="card-body">
            <h4 class="card-title">Add New Task</h4>
            <form id="addTaskForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <input type="text" class="form-control" id="taskTitle" placeholder="Task Title" required>
                </div>
                <div class="col-md-4">
                  <input type="text" class="form-control" id="taskDescription" placeholder="Description (optional)">
                </div>
                <div class="col-md-2">
                  <button type="submit" class="btn btn-primary w-100">Add Task</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-12">
        <div class="btn-group" role="group" aria-label="Filter Tasks">
          <button type="button" class="btn btn-outline-primary active" data-filter="all">All Tasks</button>
          <button type="button" class="btn btn-outline-primary" data-filter="active">Active</button>
          <button type="button" class="btn btn-outline-primary" data-filter="completed">Completed</button>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="card shadow">
          <div class="card-body">
            <h4 class="card-title mb-4">My Tasks</h4>
            <div id="taskList" class="list-group">
              <!-- Tasks will be loaded here -->
            </div>
            <div id="emptyState" class="text-center p-5 d-none">
              <i class="bi bi-list-check" style="font-size: 3rem;"></i>
              <p class="mt-3">No tasks found. Add a new task to get started!</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal fade" id="editTaskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editTaskModalLabel">Edit Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editTaskForm">
            <input type="hidden" id="editTaskId">
            <div class="mb-3">
              <label for="editTaskTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTaskTitle" required>
            </div>
            <div class="mb-3">
              <label for="editTaskDescription" class="form-label">Description</label>
              <input type="text" class="form-control" id="editTaskDescription">
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="editTaskCompleted">
              <label class="form-check-label" for="editTaskCompleted">
                Mark as completed
              </label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveTaskBtn">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="tasks.js"></script>
</body>
</html>

  <!-- Footer -->
  <footer class="footer mt-auto py-3  fixed-bottom">
    <div class="container text-center">
      <span>All reserved for Mohamed Alaa.</span>
      <a href="https://www.linkedin.com/in/mohamed-alaa-54236727a?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank" class="text-black ms-2"><i class="bi bi-linkedin"></i></a>
      <a href="https://github.com/moashebl" target="_blank" class="text-black ms-2"><i class="bi bi-github"></i></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
